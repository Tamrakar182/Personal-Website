    <script>
        function supportsCrossDocumentViewTransitions() {
            return (
                CSS.supports("view-transition-name: root") &&
                !window.matchMedia("(prefers-reduced-motion: reduce)").matches
            );
        }

        if (sessionStorage.getItem("nierRevealTransition") === "1") {
            sessionStorage.removeItem("nierRevealTransition");

            if (!supportsCrossDocumentViewTransitions()) {
                document.documentElement.classList.add("from-nier-transition");

                window.addEventListener("DOMContentLoaded", () => {
                    requestAnimationFrame(() => {
                        document.documentElement.classList.add("nier-transition-ready");
                    });
                });
            }
        }

        window.addEventListener("pagehide", () => {
            sessionStorage.setItem("nierReturnTransition", "1");
        });

        const sideButtons = [...document.querySelectorAll(".menu-item")];
        const recordList = document.getElementById("recordList");
        const pageTitle = document.getElementById("pageTitle");
        const helpText = document.getElementById("helpText");
        const focusMeter = document.getElementById("focusMeter");

        const sectionKeys = Object.keys(database);

        let currentSection = "about";
        let currentSectionIndex = sectionKeys.indexOf(currentSection);
        let currentIndex = 0;

        // "side" = right-most section cursor
        // "records" = middle record cursor
        let activeCursor = "side";

        function setActiveCursor(cursor) {
            activeCursor = cursor;

            document.body.classList.toggle("cursor-side-active", activeCursor === "side");
            document.body.classList.toggle("cursor-records-active", activeCursor === "records");

            updateCursorVisibility();
            updateHelpText();
        }

        function updateCursorVisibility() {
            sideButtons.forEach((button, index) => {
                button.classList.toggle(
                    "is-cursor",
                    activeCursor === "side" && index === currentSectionIndex
                );
            });

            [...document.querySelectorAll(".record-item")].forEach((button, index) => {
                button.classList.toggle(
                    "is-cursor",
                    activeCursor === "records" && index === currentIndex
                );
            });
        }

        function updateHelpText() {
            if (activeCursor === "side") {
                helpText.textContent = "Select a section.";
                return;
            }

            helpText.textContent = database[currentSection].help;
        }

        function renderRecords(section) {
            const data = database[section];
            recordList.innerHTML = "";

            data.items.forEach((item, index) => {
                const li = document.createElement("li");
                const button = document.createElement("button");

                button.type = "button";
                button.className = "record-item";
                button.innerHTML = `<span>${item.name}</span><span class="meta">${item.meta}</span>`;

                // Mouse click opens/directly selects the record regardless of active keyboard cursor.
                button.addEventListener("click", () => {
                    activeCursor = "records";
                    selectRecord(index);
                    setActiveCursor("records");
                    openRecord(database[currentSection].items[index]);
                });

                li.appendChild(button);
                recordList.appendChild(li);
            });

            updateRecordStates();
        }

        function renderDetail() {
            const data = database[currentSection];
            const item = data.items[currentIndex] || data.items[0];

            document.getElementById("detailTitle").textContent = item.name;
            document.getElementById("detailLevel").textContent = item.meta;
            document.getElementById("detailRole").textContent = item.role;
            document.getElementById("detailArea").textContent = item.area;
            document.getElementById("statStack").textContent = item.stack;
            document.getElementById("statExp").textContent = item.exp;
            document.getElementById("statFocus").textContent = `${item.focus}/100`;
            document.getElementById("statMobile").textContent = item.mobile;
            document.getElementById("statBackend").textContent = item.backend;
            document.getElementById("statCommunity").textContent = item.community;

            const detailCopy = document.getElementById("detailCopy");

            if (item.url) {
                detailCopy.innerHTML = `<a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.copy}</a>`;
            } else {
                detailCopy.textContent = item.copy;
            }

            focusMeter.style.setProperty("--meter", `${item.focus}%`);

            updateRecordStates();
            updateCursorVisibility();
        }

        function updateSideStates() {
            sideButtons.forEach((btn, index) => {
                const section = sectionKeys[index];

                btn.classList.toggle("is-active", section === currentSection);
                btn.classList.toggle(
                    "is-cursor",
                    activeCursor === "side" && index === currentSectionIndex
                );
            });
        }

        function updateRecordStates() {
            [...document.querySelectorAll(".record-item")].forEach((button, index) => {
                button.classList.toggle("is-active", index === currentIndex);
                button.classList.toggle(
                    "is-cursor",
                    activeCursor === "records" && index === currentIndex
                );
            });
        }

        function previewSection(section) {
            if (!database[section]) return;

            currentSection = section;
            currentSectionIndex = sectionKeys.indexOf(section);
            currentIndex = 0;

            const data = database[section];

            pageTitle.textContent = data.title;

            updateSideStates();
            renderRecords(section);
            renderDetail();
            updateHelpText();
        }

        function confirmSection() {
            const section = sectionKeys[currentSectionIndex];
            previewSection(section);

            // After choosing a section, keyboard cursor moves into the middle records panel.
            setActiveCursor("records");
        }

        function selectRecord(index) {
            const count = database[currentSection].items.length;
            currentIndex = ((index % count) + count) % count;
            renderDetail();
        }

        function openRecord(item) {
            if (item?.url) {
                window.open(item.url, "_blank", "noopener,noreferrer");
            }
        }

        sideButtons.forEach((button, index) => {
            button.addEventListener("click", () => {
                currentSectionIndex = index;
                previewSection(button.dataset.target);

                // Mouse click on section should directly open/select that section
                // and move cursor into the middle record list.
                setActiveCursor("records");
            });
        });

        window.addEventListener("keydown", (event) => {
            const key = event.key.toLowerCase();

            if (
                ["arrowdown", "arrowup", "arrowleft", "arrowright", "w", "s", "a", "d", "enter", "escape"].includes(key)
            ) {
                event.preventDefault();
            }

            if (key === "arrowright" || key === "d") {
                setActiveCursor("records");
                return;
            }

            if (key === "arrowleft" || key === "a") {
                setActiveCursor("side");
                return;
            }

            if (key === "escape") {
                setActiveCursor("side");
                return;
            }

            if (activeCursor === "side") {
                const sectionCount = sectionKeys.length;

                if (key === "arrowdown" || key === "s") {
                    currentSectionIndex = (currentSectionIndex + 1) % sectionCount;
                    previewSection(sectionKeys[currentSectionIndex]);
                    return;
                }

                if (key === "arrowup" || key === "w") {
                    currentSectionIndex = (currentSectionIndex - 1 + sectionCount) % sectionCount;
                    previewSection(sectionKeys[currentSectionIndex]);
                    return;
                }

                if (key === "enter") {
                    confirmSection();
                    return;
                }
            }

            if (activeCursor === "records") {
                const count = database[currentSection].items.length;

                if (key === "arrowdown" || key === "s") {
                    selectRecord(currentIndex + 1);
                    return;
                }

                if (key === "arrowup" || key === "w") {
                    selectRecord(currentIndex - 1);
                    return;
                }

                if (key === "enter") {
                    openRecord(database[currentSection].items[currentIndex]);
                    return;
                }
            }
        });

        previewSection("about");
        setActiveCursor("side");
