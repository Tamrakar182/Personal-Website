<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#14110c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>UNDER CONSTRUCTION</title>
    <meta name="description" content="Under construction." />

    <link rel="stylesheet" href="/public/css/nier-shared.css" />
    <link rel="stylesheet" href="/public/css/nier.css" />

    <script>
        function supportsCrossDocumentViewTransitions() {
            return (
                CSS.supports("view-transition-name: root") &&
                !window.matchMedia("(prefers-reduced-motion: reduce)").matches
            );
        }

        if (sessionStorage.getItem("nierRevealTransition") === "1") {
            sessionStorage.removeItem("nierRevealTransition");

            if (!supportsCrossDocumentViewTransitions()) {
                document.documentElement.classList.add("from-nier-transition");

                window.addEventListener("DOMContentLoaded", () => {
                    requestAnimationFrame(() => {
                        document.documentElement.classList.add("nier-transition-ready");
                    });
                });
            }
        }

        window.addEventListener("pagehide", () => {
            sessionStorage.setItem("nierReturnTransition", "1");
        });
    </script>
</head>

<body>
    <main>
        <div class="code">YoRHa Archive Access</div>
        <h1>UNDER CONSTRUCTION</h1>
        <p class="subtitle">System module unavailable<span class="cursor">_</span></p>
    </main>
</body>

</html>
